<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Переход к каталогу</title>
    <script>
      // GitHub Pages не перенаправляет SPA-маршруты на index.html сам.
      // Для project page сохраняем первый сегмент пути — имя репозитория.
      (function (location) {
        var segmentsToKeep = location.hostname.endsWith('.github.io') ? 1 : 0;
        var path = location.pathname
          .slice(1)
          .split('/')
          .slice(segmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');
        var base = location.pathname
          .split('/')
          .slice(0, segmentsToKeep + 1)
          .join('/');
        location.replace(
          location.protocol + '//' + location.host + base + '/?/' + path +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
