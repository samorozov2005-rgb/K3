<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Каталог товаров на React" />
    <title>Каталог товаров</title>
    <script>
      // Восстанавливает чистый SPA-маршрут после перенаправления из 404.html.
      (function (location) {
        if (location.search.startsWith('?/')) {
          var route = location.search
            .slice(2)
            .split('&')
            .map(function (part) { return part.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(
            null,
            '',
            location.pathname.replace(/\/$/, '') + '/' + route + location.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
